<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExServer Service</title>
<style>
body{font:15px system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;color:#1a1a2e;background:#f6f6fa}
h1{font-size:1.4rem}.card{background:#fff;border-radius:8px;padding:1rem;margin-bottom:1rem;box-shadow:0 1px 3px #0002}
input{padding:.5rem;border:1px solid #bbb;border-radius:6px;width:260px}
button{padding:.5rem .9rem;border:0;border-radius:6px;background:#6d3df2;color:#fff;cursor:pointer}
button.danger{background:#d33}button:disabled{opacity:.4;cursor:default}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.45rem;border-bottom:1px solid #eee;font-size:.9rem}
code{background:#eee;padding:2px 5px;border-radius:4px;word-break:break-all}
.new{background:#e8f8ec;border:1px solid #9bd5a8}.err{color:#c00}.off{color:#888}
</style></head><body>
<h1>ExServer Service – API Anahtarları</h1>
<div class="card">
  <form id="f"><input id="label" placeholder="Etiket" required maxlength="200"> <button>Anahtar oluştur</button></form>
  <div id="msg" class="err"></div>
  <div id="new" class="card new" hidden>Yeni anahtar (bir daha gösterilmez):<br><code id="key"></code></div>
</div>
<div class="card"><table><thead><tr><th>Etiket</th><th>Anahtar</th><th>Durum</th><th>Oluşturma</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);
async function api(path,body){
  const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j;}
function cell(tr,text,el){const td=document.createElement('td');if(el)td.appendChild(el);else td.textContent=text;tr.appendChild(td);}
async function load(){
  const {keys}=await api('/api/keys');const t=$('rows');t.textContent='';
  if(!keys.length){t.innerHTML='<tr><td colspan="5" class="off">Kayıtlı anahtar yok</td></tr>';return;}
  for(const k of keys){
    const tr=document.createElement('tr');
    cell(tr,k.label);const c=document.createElement('code');c.textContent=k.key;cell(tr,0,c);
    cell(tr,k.active?'Aktif':'İptal edildi');cell(tr,new Date(k.created_at).toLocaleString('tr-TR'));
    const b=document.createElement('button');b.textContent='İptal et';b.className='danger';b.disabled=!k.active;
    b.onclick=async()=>{if(!confirm('Bu anahtar iptal edilsin mi?'))return;
      try{await api('/api/keys/revoke',{id:k.id});load();}catch(e){$('msg').textContent=e.message;}};
    cell(tr,0,b);t.appendChild(tr);}
}
$('f').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';
  try{const j=await api('/api/keys/create',{label:$('label').value});
    $('key').textContent=j.api_key;$('new').hidden=false;$('label').value='';load();}
  catch(e){$('msg').textContent=e.message;}};
load().catch(e=>$('msg').textContent=e.message);
</script></body></html>
