<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>API Service</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;color:#1a1a2e;background:#f4f5fa}
main{max-width:760px;margin:0 auto;padding:2rem 1rem}
h1{font-size:1.9rem;margin:.2rem 0}h2{font-size:1.1rem;font-weight:500;color:#555;margin:0 0 1.5rem}
.menu{display:grid;gap:.8rem}
.opt{padding:1.1rem 1.2rem;border:0;border-radius:12px;background:#fff;box-shadow:0 1px 4px #0002;font-size:1rem;text-align:left;cursor:pointer;color:inherit}
.opt:hover{box-shadow:0 2px 10px #6d3df255}
.card{background:#fff;border-radius:12px;padding:1.2rem;box-shadow:0 1px 4px #0002;margin-top:1.5rem}
input{width:100%;padding:.8rem;border:1px solid #bbb;border-radius:8px;font-size:1rem;margin-bottom:.8rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
button.p,button.s,button.d{padding:.7rem 1.1rem;border:0;border-radius:8px;font-size:.95rem;cursor:pointer}
.p{background:#6d3df2;color:#fff}.s{background:#e6e6ef;color:#222}.d{background:#d33;color:#fff;padding:.4rem .7rem!important;font-size:.85rem!important}
.d:disabled{opacity:.4;cursor:default}
.new{background:#e8f8ec;border:1px solid #9bd5a8;border-radius:8px;padding:.8rem;margin-bottom:.8rem}
code{background:#eee;padding:2px 5px;border-radius:4px;word-break:break-all}
.err{color:#c00;min-height:1.2em}.item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid #eee}
.tag{display:inline-block;background:#ece6ff;color:#4b24c4;border-radius:99px;padding:1px 9px;font-size:.78rem;margin-left:.3rem}
.off{color:#888;font-size:.85rem}[hidden]{display:none!important}
</style></head><body><main>
<section id="home">
  <h1>API Service</h1><h2>API Anahtarları:</h2>
  <div class="menu">
    <button class="opt" data-t="yapay-zeka">Yapay zekanız için API anahtarı oluşturun</button>
    <button class="opt" data-t="ceviri">Çeviri için API anahtarınızı oluşturun</button>
    <button class="opt" data-t="arama-motoru">Arama motoru için API anahtarınızı oluşturun</button>
  </div>
  <div class="card"><b>Mevcut anahtarlar</b><div id="list"></div></div>
</section>
<section id="create" hidden>
  <h1 id="title"></h1>
  <div class="card">
    <div id="new" class="new" hidden>Yeni anahtar (bir daha gösterilmez):<br><code id="key"></code></div>
    <form id="f"><input id="label" placeholder="API Anahtarınıza isim verin" aria-label="API Anahtarınıza isim verin" required maxlength="200">
    <div class="row"><button class="p">Anahtar oluştur</button><button type="button" class="s" id="exit">Çıkış</button></div></form>
    <div id="msg" class="err"></div>
  </div>
</section>
<script>
const $=id=>document.getElementById(id);
const NAMES={'yapay-zeka':'Yapay Zeka','ceviri':'Çeviri','arama-motoru':'Arama Motoru'};
let cur=null;
async function api(p,body){const r=await fetch(p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j;}
function show(id){$('home').hidden=id!=='home';$('create').hidden=id!=='create';}
async function load(){
  const {keys}=await api('/api/keys');const L=$('list');L.textContent='';
  if(!keys.length){L.innerHTML='<p class="off">Kayıtlı anahtar yok</p>';return;}
  for(const k of keys){
    const d=document.createElement('div');d.className='item';
    const l=document.createElement('div');
    const n=document.createElement('b');n.textContent=k.label;
    const t=document.createElement('span');t.className='tag';t.textContent=k.type;
    const c=document.createElement('div');const cc=document.createElement('code');cc.textContent=k.key;c.append(cc);
    const st=document.createElement('span');st.className='off';st.textContent=k.active?' Aktif':' İptal edildi';c.append(st);
    l.append(n,t,c);
    const b=document.createElement('button');b.className='d';b.textContent='İptal et';b.disabled=!k.active;
    b.onclick=async()=>{if(!confirm('Bu anahtar iptal edilsin mi?'))return;try{await api('/api/keys/revoke',{id:k.id});load();}catch(e){alert(e.message);}};
    d.append(l,b);L.append(d);}
}
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  cur=b.dataset.t;$('title').textContent=NAMES[cur]+' API Key';
  $('new').hidden=true;$('msg').textContent='';$('label').value='';show('create');$('label').focus();});
$('exit').onclick=()=>{show('home');load().catch(()=>{});};
$('f').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';
  try{const j=await api('/api/keys/create',{label:$('label').value,type:cur});
    $('key').textContent=j.api_key;$('new').hidden=false;$('label').value='';}
  catch(e){$('msg').textContent=e.message;}};
load().catch(e=>{$('list').textContent=e.message;});
</script></main></body></html>
